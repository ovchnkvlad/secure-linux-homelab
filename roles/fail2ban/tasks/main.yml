---
- name: Install Fail2ban
  ansible.builtin.apt:
    name: fail2ban
    state: present

- name: Configure the SSH jail
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: "0644"
  notify: Restart Fail2ban

- name: Enable the Fail2ban service
  ansible.builtin.service:
    name: fail2ban
    enabled: true
    state: started

